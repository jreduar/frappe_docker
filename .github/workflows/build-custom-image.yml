name: Build Custom Image

on:
  push:
    branches: [main]
    paths:
      # Cut a new image by bumping image.version; also rebuild when the
      # build definition changes. apps.json is gitignored (holds tokens),
      # so app updates are picked up via CACHE_BUST on every run.
      - image.version
      - images/custom/Containerfile
      - .github/workflows/build-custom-image.yml
  workflow_dispatch: {}

concurrency:
  group: build-custom-image
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jreduar/frappe_docker

jobs:
  build:
    runs-on: ubuntu-latest # native amd64 — no QEMU emulation
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read image version
        id: version
        run: echo "version=$(tr -d '[:space:]' < image.version)" >> "$GITHUB_OUTPUT"

      - name: Write apps.json from secret
        env:
          APPS_JSON: ${{ secrets.APPS_JSON }}
        run: printf '%s' "$APPS_JSON" > apps.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/custom/Containerfile
          platforms: linux/amd64
          push: true
          secret-files: |
            apps_json=apps.json
          build-args: |
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
